{% extends "base.html" %}
{% block title %}Delete {{ item.name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete “{{ item.name }}”?</h1>
  <p>This permanently removes the piece along with its extras, photos and links. It cannot be undone.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="danger">Delete permanently</button>
    <a href="{{ url_for('main.item_detail', item_id=item.id) }}">Cancel</a>
  </form>
</section>
{% endblock %}
